[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the intended idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # readability of test fixtures/data > strict line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
